---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - resourcequotas
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autoresize.csiaddons.openshift.io
  resources:
  - pvcautoresizepolicies
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autoresize.csiaddons.openshift.io
  resources:
  - pvcautoresizepolicies/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - quota.openshift.io
  resources:
  - clusterresourcequotas
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - watch
